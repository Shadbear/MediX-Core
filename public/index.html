<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediX-Core · Hospital</title><link rel="icon" href="data:,">
<style>
:root{--navy:#082f49;--teal:#0d9488;--teal2:#14b8a6;--bg:#eef6f8;--card:#fff;--tx:#12303f;--mut:#5b7685;--red:#e11d48;--org:#f59e0b;--grn:#16a34a}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:250px;background:linear-gradient(180deg,var(--navy),#0b4a5e);color:#cfe8ee;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#fff;padding:4px 8px 14px}.logo i{width:36px;height:36px;border-radius:10px;background:var(--teal2);display:grid;place-items:center;font-style:normal;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #14b8a688}70%{box-shadow:0 0 0 12px #14b8a600}100%{box-shadow:0 0 0 0 #14b8a600}}
nav h6{margin:14px 8px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7fb3c2}
nav button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;transition:.2s}
nav button:hover{background:#ffffff14;transform:translateX(3px)}nav button.on{background:var(--teal);color:#fff}
main{flex:1;min-width:0}header{background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}
header h1{margin:0;font-size:20px;position:relative}header small{opacity:.8}.ecg{position:absolute;right:0;top:0;height:100%;width:60%;opacity:.35}
.ecg polyline{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:600;animation:ecg 3s linear infinite}@keyframes ecg{from{stroke-dashoffset:600}to{stroke-dashoffset:-600}}
#v{padding:22px;display:grid;gap:18px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px #0831491a}.card h3{margin:0 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{border-left:5px solid var(--teal);transition:.2s}.kpi:hover{transform:translateY(-3px)}.kpi b{font-size:30px;display:block}.kpi span{color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c5d9e0;border-radius:8px;font:inherit;margin-top:3px;background:#fff}
input:focus,select:focus{outline:2px solid var(--teal2);border-color:transparent}input[type=checkbox]{width:auto;margin:0 6px 0 0}.chk{display:flex;align-items:center;font-size:14px;color:var(--tx);margin:4px 0}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.s{padding:4px 9px;font-size:13px}.btn.r{background:var(--red)}.btn.o{background:var(--org)}.btn.g{background:#64748b}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:600;padding:6px}td{padding:7px 6px;border-top:1px solid #e3eef2}.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--grn)}.tag.r{background:var(--red)}.tag.o{background:var(--org)}.tag.g{background:#64748b}.tag.b{background:#0284c7}
.bed{border-radius:12px;padding:14px;color:#fff;text-align:center;transition:.2s}.bed:hover{transform:scale(1.04)}.bed b{font-size:22px;display:block}.bed.Libre{background:var(--grn)}.bed.Ocupada{background:var(--red)}.bed.Mantenimiento{background:var(--org)}.bed button{margin-top:6px;font-size:11px;border:0;border-radius:6px;padding:3px 6px;cursor:pointer}
.res{padding:16px;border-radius:12px;color:#fff;font-weight:600}.res.r{background:var(--red);animation:blink 1s infinite}.res.o{background:var(--org)}.res.g{background:var(--grn)}@keyframes blink{50%{opacity:.7}}
.stars button{font-size:30px;background:none;border:0;cursor:pointer;filter:grayscale(1);transition:.2s}.stars button:hover{filter:none;transform:scale(1.3)}
#scr{position:fixed;inset:0;background:radial-gradient(circle,#0b4a5e,#041f30);color:#fff;z-index:50;text-align:center;padding:40px;display:none;flex-direction:column;justify-content:center}
#scr .n{font-size:min(22vw,200px);font-weight:900;color:var(--teal2);line-height:1}#scr .q span{display:inline-block;margin:6px;padding:8px 18px;background:#ffffff1f;border-radius:10px;font-size:24px}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:grid;gap:8px}#toast div{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 4px 16px #0006;animation:in .3s}#toast .err{background:var(--red)}
#login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center}#login form{background:#fff;padding:28px;border-radius:16px;width:min(360px,92vw);box-shadow:0 10px 40px #0007}#login h2{margin:0 0 14px}
.mut{color:var(--mut)}
.adm{display:grid;gap:14px;grid-template-columns:minmax(250px,1fr) minmax(230px,300px) minmax(300px,1.3fr);align-items:start}
@media(max-width:1100px){.adm{grid-template-columns:1fr}}
.flt{display:grid;gap:6px}.flt2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.pr{display:block;width:100%;text-align:left;border:1px solid #c5d9e0;background:#fff;border-radius:8px;padding:7px 9px;margin:4px 0;font:inherit;cursor:pointer;transition:.2s}.pr small{display:block;color:var(--mut)}.pr:hover{border-color:var(--teal)}.pr.sel{background:#ccfbf1;border-color:var(--teal)}
.slot{display:block;width:100%;text-align:left;border:1px solid #bbf7d0;border-left:5px solid var(--grn);border-radius:6px;padding:6px 9px;margin:3px 0;font:inherit;background:#f0fdf4}
button.slot{cursor:pointer}button.slot:hover,.slot.sel{background:#bbf7d0}.slot em{float:right;font-style:normal;color:var(--mut);font-size:13px}
.slot.Ocupado{background:#ede9fe;border-color:#c4b5fd;border-left-color:#7c3aed}.slot.Vencido{background:#f1f5f9;border-color:#e2e8f0;border-left-color:#94a3b8;color:#94a3b8}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.ch{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.cd{min-height:44px;border-radius:6px;border:1px solid #e3eef2;padding:3px 5px;font:inherit;text-align:left;background:#fff;display:block}.cd small{display:block;font-size:11px;color:var(--mut)}
.cd.off{background:#f4f8fa;color:#a8bcc5}button.cd.on{cursor:pointer;border-color:var(--teal2);background:#f0fdfa}button.cd.full{background:#fef2f2;border-color:#fecaca}button.cd.sel,.cd.sel{background:var(--teal);color:#fff;border-color:var(--teal)}.cd.sel small{color:#e6fffb}button.cd.past{background:#f4f8fa;border-color:#e3eef2;color:#8aa1ab}.cd.hoy{outline:2px solid var(--org)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 6px}.quedan{color:var(--red);font-weight:800}
.rxp{border:1px dashed #94a3b8;padding:16px;border-radius:10px;background:#fff}
@media print{body *{visibility:hidden}#rxp,#rxp *{visibility:visible}#rxp{position:absolute;left:0;top:0;width:100%;border:0}}
@media(max-width:800px){body{display:block}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}nav h6{width:100%}nav button{width:auto}}
</style></head><body>
<nav id="nav"></nav><main><header><div><h1 id="ttl"></h1><small id="clk"></small></div><div style="position:relative"><span id="who"></span> <button class="btn s g" data-a="logout">Salir</button></div><svg class="ecg" viewBox="0 0 600 60" preserveAspectRatio="none"><polyline points="0,30 120,30 140,30 155,6 170,54 185,30 300,30 320,30 335,6 350,54 365,30 480,30 500,30 515,6 530,54 545,30 600,30"/></svg></header><div id="v"></div></main>
<div id="login"><form data-f="login"><h2>✚ MediX-Core</h2><label>Usuario<input name="u" required autocomplete="username"></label><label>Contraseña<input name="p" type="password" required autocomplete="current-password"></label><button class="btn" style="width:100%">Ingresar</button></form></div><div id="scr"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOY=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),HM=()=>new Date().toTimeString().slice(0,5);
let S={},tab='inicio',tri=null,scr=false,snd=false,last=null,alerted={},ac;
const SALAS=['Sala de reuniones 1','Sala de reuniones 2','Pabellón quirúrgico A','Pabellón quirúrgico B'];
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json','X-Requested-With':'medix'},body:b?JSON.stringify(b):void 0}),j=await r.json();if(r.status==401&&p!=='/auth/login'){$('#login').style.display='flex';throw 0}if(!r.ok){toast(j.error||'Error','err');throw 0}return j}
const load=async()=>{const m=await api('GET','/auth/me');ROLE=m.role;S=await api('GET','');if(tab=='admision')await refreshAD();$('#login').style.display='none';$('#who').textContent=m.u+' · '+m.role;draw()};
function toast(t,c=''){const d=document.createElement('div');d.className=c;d.textContent=t;$('#toast').append(d);setTimeout(()=>d.remove(),5000)}
function beep(n=2){if(!ac)return;for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,ac.currentTime+i*.4);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.4+.3);o.start(ac.currentTime+i*.4);o.stop(ac.currentTime+i*.4+.3)}}
const f=(l,n,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" ${x}></label>`,
sel=(l,n,o)=>`<label>${l}<select name="${n}">${o.map(v=>`<option>${esc(v)}</option>`).join('')}</select></label>`,
tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}">Sin registros</td></tr>`}</table></div>`,
tr=c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`,
b=(a,id,t,c='',v='')=>`<button class="btn s ${c}" data-a="${a}" data-id="${id}" data-v="${esc(v)}">${t}</button>`,
tag=(t,c='')=>`<span class="tag ${c}">${esc(t)}</span>`,
card=(t,h)=>`<div class="card"><h3>${t}</h3>${h}</div>`,
docs=()=>S.directorio.filter(d=>!/enfermer/i.test(d.especialidad)).map(d=>d.nombre);
const SINT=[['Dolor de pecho',5],['Dificultad para respirar',5],['Pérdida de conciencia',5],['Sangrado abundante',4],['Fiebre alta (>39 °C)',3],['Dolor intenso',3],['Vómitos o diarrea',2],['Tos persistente',1],['Dolor de cabeza',1],['Malestar leve',1]];
const NAV=[['inicio','🏥','Panel general'],['Consulta externa'],['paciente','🧑','Paciente'],['admision','🗓️','Citas y admisión'],['trajereg','🩺','Registro de triaje'],['atenc','📝','Registro de atenciones'],['rx','💊','Recetas'],['Programación'],['prog','👩‍⚕️','Programación de médicos'],['Atención'],['triaje','🩺','Triaje digital (autoevaluación)'],['turnos','🔔','Turnos'],['recetas','💊','Recordatorio de tomas'],['Logística'],['stock','📦','Stock médico'],['equipos','🔬','Rastreador equipos'],['camas','🛏️','Gestión de camas'],['Administración'],['visitas','🚪','Registro de visitas'],['asistencia','🪪','Control asistencia'],['encuestas','⭐','Encuestas'],['salas','🏢','Reserva de salas'],['Soporte clínico'],['calc','🧮','Calculadoras'],['dir','📇','Directorio']];
const V={
inicio:()=>{const lib=S.camas.filter(c=>c.estado=='Libre').length,bajo=S.stock.filter(s=>s.cantidad<=s.minimo).length,k=(n,l,c='')=>`<div class="card kpi" style="${c}"><b>${n}</b><span>${l}</span></div>`;
 const prom=S.encuestas.length?(S.encuestas.reduce((a,e)=>a+ +e.nota,0)/S.encuestas.length).toFixed(1):'–';
 return `<div class="grid">${k(lib+'/'+S.camas.length,'Camas libres')}${k(bajo,'Insumos con stock bajo',bajo?'border-color:var(--red)':'')}${k(S.turnos.filter(t=>t.estado=='espera').length,'Pacientes en espera')}${k(S.citas.filter(c=>c.fecha==HOY()&&c.estado!='Cancelada').length,'Citas de hoy')}${k(S.visitas.filter(v=>!v.salida).length,'Visitantes dentro')}${k(prom,'Satisfacción (de 5)')}</div>
 ${card('Últimos triajes',tbl(['Paciente','Nivel','Puntaje'],S.triajes.slice(-5).reverse().map(t=>tr([esc(t.nombre),tag(t.nivel,t.c),t.puntos]))))}`},
triaje:()=>`<div class="grid two">${card('Autoevaluación de síntomas',`<form data-f="triaje">${f('Nombre','nombre','text','required')}${f('Edad','edad','number','required min=0')}<p>Marca tus síntomas:</p>${SINT.map(([s,w])=>`<label class="chk"><input type="checkbox" name="s" value="${w}">${s}</label>`).join('')}<button class="btn">Evaluar gravedad</button></form>`)}
 <div>${tri?`<div class="res ${tri.c}"><h2 style="margin:0">${tri.nivel}</h2>${tri.msg}</div>`:card('Resultado','Completa el formulario para conocer tu nivel de prioridad. <br><small>Es una orientación, no un diagnóstico.</small>')}</div></div>`,
turnos:()=>`<div class="grid two">${card('Emisión de turnos',`<form data-f="turno">${f('Paciente','paciente','text','required')}${sel('Área','area',['Medicina general','Emergencias','Pediatría','Laboratorio'])}<button class="btn">Generar turno</button></form><hr><button class="btn" data-a="next">📢 Llamar siguiente</button> <button class="btn g" data-a="screen">🖥️ Abrir pantalla de sala de espera</button>`)}
 ${card('Cola',tbl(['Turno','Paciente','Área','Estado'],S.turnos.filter(t=>t.estado!='atendido').map(t=>tr([`<b>${t.num}</b>`,esc(t.paciente),esc(t.area),tag(t.estado,t.estado=='llamado'?'r':'b')]))))}</div>`,
recetas:()=>`<div class="grid two">${card('Nuevo recordatorio',`<form data-f="receta">${f('Paciente','paciente','text','required')}${f('WhatsApp (con código país)','tel','tel','required placeholder="51999999999"')}${f('Medicamento','medicamento','text','required')}${f('Dosis','dosis')}${f('Hora diaria','hora','time','required')}<button class="btn">Guardar</button></form>`)}
 ${card('Recordatorios activos',tbl(['Paciente','Medicamento','Hora',''],S.recetas.map(r=>tr([esc(r.paciente),esc(r.medicamento)+' '+esc(r.dosis),r.hora,`<a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${esc(r.tel)}?text=${encodeURIComponent(`Hola ${r.paciente}, es hora de tomar ${r.medicamento} ${r.dosis||''}.`)}">WhatsApp</a> ${b('del:recetas',r.id,'✕','r')}`]))))}</div>`,
stock:()=>`<div class="grid two">${card('Nuevo insumo',`<form data-f="insumo">${f('Insumo','nombre','text','required')}${f('Cantidad inicial','cantidad','number','required min=0')}${f('Mínimo para alerta','minimo','number','required min=0')}<button class="btn">Agregar</button></form>`)}
 ${card('Inventario',tbl(['Insumo','Stock','Mínimo','',''],S.stock.map(s=>tr([esc(s.nombre),`<b>${s.cantidad}</b>`,s.minimo,s.cantidad<=s.minimo?tag('⚠ Stock bajo','r'):tag('OK'),b('in',s.id,'+ Entrada')+' '+b('out',s.id,'− Salida','o')]))))}</div>`,
equipos:()=>`<div class="grid two"><div>${card('Registrar asignación (escanear código)',`<form data-f="asig">${f('Código del equipo (QR / barras)','codigo','text','required autofocus')}${f('Área o médico asignado','asignado','text','required list=dl')}<datalist id="dl">${S.directorio.map(d=>`<option>${esc(d.nombre)}`).join('')}</datalist><button class="btn">Asignar</button></form>`)}<br>${card('Nuevo equipo',`<form data-f="equipo">${f('Equipo','nombre','text','required')}${f('Código','codigo','text','required')}<button class="btn">Agregar</button></form>`)}</div>
 ${card('Equipos móviles',tbl(['Código','Equipo','Asignado a'],S.equipos.map(e=>tr([`<b>${esc(e.codigo)}</b>`,esc(e.nombre),tag(e.asignado,e.asignado=='Sin asignar'?'g':'b')]))))}</div>`,
camas:()=>{const c=x=>S.camas.filter(b=>b.estado==x).length;return `<div class="card"><h3>Tablero en tiempo real · ${tag('Libres '+c('Libre'))} ${tag('Ocupadas '+c('Ocupada'),'r')} ${tag('Mantenimiento '+c('Mantenimiento'),'o')}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${S.camas.map(x=>`<div class="bed ${x.estado}"><b>Cama ${x.num}</b>${x.estado}<br><small>${esc(x.paciente)}</small><br>${['Libre','Ocupada','Mantenimiento'].filter(e=>e!=x.estado).map(e=>`<button data-a="bed" data-id="${x.id}" data-v="${e}">${e}</button>`).join(' ')}</div>`).join('')}</div></div>`},
visitas:()=>`<div class="grid two">${card('Ingreso de familiar',`<form data-f="visita">${f('Nombre del visitante','visitante','text','required')}${f('DNI','dni','text','required')}${f('Parentesco','parentesco')}${f('Paciente visitado','paciente','text','required')}${f('Cama / habitación','cama')}<button class="btn">Registrar ingreso</button></form>`)}
 ${card('Visitas',tbl(['Visitante','Paciente','Ingreso','Salida'],[...S.visitas].reverse().slice(0,30).map(v=>tr([esc(v.visitante)+'<br><small>DNI '+esc(v.dni)+'</small>',esc(v.paciente)+' '+esc(v.cama),new Date(v.ts).toLocaleTimeString().slice(0,5),v.salida||b('exit',v.id,'Registrar salida','o')]))))}</div>`,
asistencia:()=>`<div class="grid two">${card('Marcación rápida',`<form data-f="marca">${f('Escanea código de barras / fotocheck','codigo','text','required autofocus autocomplete=off')}<button class="btn">Marcar</button></form><small>Prueba: MD001, MD002, MD003, EN001</small>`)}
 ${card('Marcaciones de hoy',tbl(['Hora','Personal','Tipo'],[...S.asistencia].reverse().filter(a=>a.fecha==HOY()).slice(0,40).map(a=>tr([a.hora,esc(a.nombre),tag(a.tipo,a.tipo=='Entrada'?'':'o')]))))}</div>`,
encuestas:()=>{const q=sessionStorage.nota;return `<div class="grid two">${card('¿Cómo fue tu atención?',`<form data-f="encuesta"><div class="stars">${['😡','🙁','😐','🙂','😍'].map((e,i)=>`<button type="button" data-a="star" data-v="${i+1}">${e}</button>`).join('')}</div><p id="nt">${q?'Calificación: '+q+'/5':'Elige una carita'}</p>${sel('Área atendida','area',['Consulta externa','Emergencias','Hospitalización','Laboratorio'])}<label>Comentario<textarea name="comentario" rows="2"></textarea></label><button class="btn">Enviar</button></form>`)}
 ${card('Respuestas',tbl(['Nota','Área','Comentario'],[...S.encuestas].reverse().slice(0,20).map(e=>tr(['⭐'.repeat(e.nota),esc(e.area),esc(e.comentario)]))))}</div>`},
salas:()=>`<div class="grid two">${card('Reservar sala o pabellón',`<form data-f="reserva">${sel('Sala','sala',SALAS)}${sel('Médico','medico',docs())}${f('Fecha','fecha','date',`required min="${HOY()}" value="${HOY()}"`)}${f('Inicio','inicio','time','required')}${f('Fin','fin','time','required')}${f('Motivo','motivo')}<button class="btn">Reservar</button></form>`)}
 ${card('Reservas',tbl(['Sala','Fecha','Horario','Médico',''],[...S.reservas].sort((a,b)=>(a.fecha+a.inicio).localeCompare(b.fecha+b.inicio)).map(r=>tr([esc(r.sala),r.fecha,r.inicio+'–'+r.fin,esc(r.medico),b('del:reservas',r.id,'Liberar','r')]))))}</div>`,
calc:()=>`<div class="grid two">${card('Índice de masa corporal',`<form data-f="imc">${f('Peso (kg)','p','number','required step=any')}${f('Estatura (cm)','h','number','required step=any')}<button class="btn">Calcular</button></form><div id="r1"></div>`)}
 ${card('Dosis pediátrica por peso',`<form data-f="dosis">${f('Peso (kg)','p','number','required step=any')}${f('Dosis indicada (mg/kg/día)','d','number','required step=any')}${f('Tomas por día','n','number','required value=3')}<button class="btn">Calcular</button></form><div id="r2"></div><small>Verifica siempre con la dosis máxima y el criterio del médico.</small>`)}</div>`,
dir:()=>`<div class="card"><h3>Directorio médico</h3><input id="q" placeholder="Buscar por nombre, especialidad, anexo o correo…" data-a="q"><div id="dl2" class="tw"></div></div>`

Object.assign(F,{
 paciente:async d=>{const body={...d,dni:d.dni.trim().toUpperCase()};
  if(PAC.edit){await api('PUT','/pacientes/'+PAC.edit,body);toast('Paciente actualizado');PAC.edit=null}
  else{const r=await api('POST','/pacientes',body);toast('Paciente registrado · HC '+r.hc)}},
 asignar:async d=>{const dni=String(d.pac).split(' · ')[0].trim().toUpperCase(),p=S.pacientes.find(x=>x.dni===dni);
  if(!p){toast('Elige un paciente registrado de la lista','err');throw 0}
  const r=await api('POST','/agenda/asignar',{prog:AD.prog,fecha:AD.fecha,hora:AD.slot,pid:p.id,seguro:d.seguro||p.seguro});
  toast(`Cita asignada · N° de cuenta ${r.cuenta}`);AD.slot=null;await refreshAD()},
 signos:async d=>{const o={cuenta:+TG.cuenta};if(d.pa&&d.pa.trim())o.pa=d.pa.trim();
  for(const k of['fc','fr','temp','spo2','peso','talla'])if(d[k]!=='')o[k]=+d[k];
  await api('POST','/signos',o);toast('Triaje registrado');TG.cuenta=null},
 busq:async d=>{ATN.q=d;await buscar()},
 consulta:async d=>{const o={cuenta:+ATN.sel};for(const[k,v]of Object.entries(d))if(v.trim())o[k]=v.trim();
  await api('POST','/consultas',o);toast('Atención registrada');if(ATN.rows)await buscar()},
 rxbusca:d=>{const c=cuentaDe(d.cuenta.trim());if(!c){toast('No existe esa cuenta','err');throw 0}RX.cuenta=c.cuenta},
 rx:async d=>{const o={cuenta:+RX.cuenta,medicamento:d.medicamento.trim(),dias:+d.dias,cantidad:+d.cantidad};
  for(const k of['dosis','frecuencia','indic'])if(d[k].trim())o[k]=d[k].trim();
  await api('POST','/prescripciones',o);toast('Medicamento agregado a la receta')},
 prog:async(d,e)=>{const dias=[...e.target.querySelectorAll('[name=d]:checked')].map(x=>x.value).join(',');
  await api('POST','/programacion',{medico:d.medico.trim(),especialidad:d.especialidad.trim(),consultorio:d.consultorio.trim(),hi:d.hi,hf:d.hf,dur:+d.dur,dias});toast('Programación guardada')}
});
Object.assign(A,{

 'ad:prog':async id=>{AD.prog=id;AD.fecha=null;AD.slot=null;await refreshAD()},
 'ad:mes':async id=>{const[y,m]=AD.mes.split('-').map(Number),d=new Date(Date.UTC(y,m-1+ +id,1));AD.mes=d.toISOString().slice(0,7);AD.fecha=null;AD.slot=null;await refreshAD()},
 'ad:dia':async id=>{AD.fecha=id;AD.slot=null;await refreshAD()},
 'ad:slot':id=>{AD.slot=id},
 'ad:clear':()=>{AD.fmed='';AD.fcons=''},
 'ad:prox':async()=>{const r=await api('GET','/agenda/proximo'+(AD.prog?'?prog='+AD.prog:''));

  AD.prog=r.prog;AD.fecha=r.fecha;AD.mes=r.fecha.slice(0,7);AD.slot=r.hi;await refreshAD()},
 'ad:estado':async(id,v)=>{await api('PUT','/citas/'+id,{estado:v});await refreshAD()},
 'tg:sel':c=>{TG.cuenta=c},

});

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.dataset.a=='q')return;if(!ac)try{ac=new AudioContext}catch{}
 const a=t.dataset.a;try{if(a.startsWith('del:')){await api('DELETE','/'+a.slice(4)+'/'+t.dataset.id)}else{const r=A[a](t.dataset.id,t.dataset.v);if(r&&r.then)await r;if(['tab','star','screen','next'].includes(a))return}await load()}catch{}});
